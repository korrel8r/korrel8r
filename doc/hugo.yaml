baseURL: https://korrel8r.github.io/korrel8r
title: Korrel8r

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    extensions:
      definitionList: true
    renderer:
      unsafe: true
  highlight:
    style: github

params:
  description: "Correlate observability signals and Kubernetes resources"
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: favicon.svg
      dark: favicon.svg
  page:
    width: normal
  theme:
    default: system

menu:
  main:
    - name: GitHub
      url: https://github.com/korrel8r/korrel8r/
      weight: 101
    - name: Client
      url: https://korrel8r.github.io/client/
      weight: 102
    - name: Recorded Demos
      url: https://github.com/korrel8r/demos
      weight: 103
