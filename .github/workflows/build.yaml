name: Build

on:
  # Run workflow on all pull requests.
  pull_request:
  push:
    branches: ["main", "release-coo-*"]
  workflow_dispatch: # Allow manual triggers

# Security: Explicit permissions
permissions:
  contents: read
  checks: write # For test result reporting
  pull-requests: write # For PR comments

jobs:
  build:
    if: github.repository == 'korrel8r/korrel8r'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent runaway jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26" # Should match ../../go.mod
          check-latest: true

      - name: test
        run: make test NO_CLUSTER=1
        env:
          NOLINT: 1

      - name: vulnerability check
        run: make vuln

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            coverage.out
          retention-days: 30

      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        if: always()
        with:
          paths: test-results/*.xml
