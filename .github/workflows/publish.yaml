name: Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allow manual triggers

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Prevent runaway jobs
    permissions:
      contents: read # Explicit permissions for security
    outputs:
      should-deploy: ${{ steps.status.outputs.changes != '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Get full history for reliable git operations
          fetch-depth: 0
          fetch-tags: true

      - name: Check for changes
        id: status
        run: |
          DIFF=$(git diff HEAD^ --name-only -- doc)
          if [ -z "$DIFF" ]; then
             echo changes=0 >> $GITHUB_OUTPUT
             echo "::notice::No doc changes, skipping publish"
          else
             echo changes=1 >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-go@v7
        if: steps.status.outputs.changes != '0'
        with:
          go-version: "1.26"

      - uses: actions/cache@v6
        if: steps.status.outputs.changes != '0'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate Web Site
        if: steps.status.outputs.changes != '0'
        run: make doc/public

      - name: Upload web site
        if: steps.status.outputs.changes != '0'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/public

  deploy:
    needs: docs
    if: needs.docs.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Pages deployment should be quick

    permissions: # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    environment: # Deploy to the github-pages environment
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
