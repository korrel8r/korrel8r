apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- clusterrole.yaml
- clusterrolebinding.yaml
- deployment.yaml
- namespace.yaml
- service.yaml
- serviceaccount.yaml
- monitoring/service-monitor.yaml

namespace: korrel8r

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: korrel8r
images:
- name: korrel8r
  newName: default-route-openshift-image-registry.apps.snoflake.lan/alanconway/korrel8r
  newTag: 0.12.3-dev
