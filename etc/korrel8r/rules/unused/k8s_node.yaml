# Unused rules to/from k8s.Node
#
# Nodes are not interesting in terms of correlation - things that run on the same node don't
# necessarily have anything else in common. Rules that map from nodes produce very high volume
# of results, e.g. it's easy to get every pod in the cluster if you include a NodeToPod rule.
# This overwhelms the useful results of korrel8r with unhelpful data.
#
rules:
  - name: NodeToResourceSlice
    start:
      domain: k8s
      classes: [Node]
    goal:
      domain: k8s
      classes: [ResourceSlice.resource.k8s.io]
    result:
      query: |-
        k8s:ResourceSlice.resource.k8s.io:{"fields":{"spec.nodeName":"{{.metadata.name}}"}}

  - name: PodToNode
    start:
      domain: k8s
      classes: [Pod]
    goal:
      domain: k8s
      classes: [Node]
    result:
      query: |-
        k8s:Node:{"name":"{{required (index .spec "nodeName")}}"}

  - name: VolumeAttachmentToNode
    start:
      domain: k8s
      classes: [VolumeAttachment.storage.k8s.io]
    goal:
      domain: k8s
      classes: [Node]
    result:
      query: |-
        k8s:Node:{"name":"{{.spec.nodeName}}"}

  - name: EndpointSliceToNode
    start:
      domain: k8s
      classes: [EndpointSlice.discovery.k8s.io]
    goal:
      domain: k8s
      classes: [Node]
    result:
      query: |-
        {{- range .endpoints}}
        {{- with .nodeName}}
        k8s:Node:{"name":"{{.}}"}
        {{- end}}
        {{- end}}

  - name: ResourceSliceToNode
    start:
      domain: k8s
      classes: [ResourceSlice.resource.k8s.io]
    goal:
      domain: k8s
      classes: [Node]
    result:
      query: |-
        {{- with .spec.nodeName}}
        k8s:Node:{"name":"{{.}}"}
        {{- end}}
