aliases:
  - name: selectors
    domain: k8s
    classes:
      - ReplicationController
      - DaemonSet.apps
      - Deployment.apps
      - ReplicaSet.apps
      - StatefulSet.apps
      - Job.batch
      - PodDisruptionBudget.policy
rules:
  - name: SelectorToPods
    start:
      domain: k8s
      classes: [selectors]
    goal:
      domain: k8s
      classes: [Pod]
    result:
      query: |-
        k8s:Pod:{"namespace": "{{.metadata.namespace}}"
        {{- with .spec.selector.matchLabels}}, "labels": {{mustToJson . -}}{{end -}} }

  - name: ServiceToPods
    start:
      domain: k8s
      classes: [Service]
    goal:
      domain: k8s
      classes: [Pod]
    result:
      query: |-
        k8s:Pod:{"namespace":"{{.metadata.namespace}}"
        {{- with .spec.selector}}, "labels": {{mustToJson . -}}{{end -}} }

  - name: EventToAll
    start:
      domain: k8s
      classes: [Event.v1]
    goal:
      domain: k8s
    result:
      query: |-
        {{- with .involvedObject -}}
        {{k8sClass .apiVersion .kind}}:{namespace: {{.namespace}}, name: {{.name}}}
        {{- end -}}

  - name: Event2ToAll
    start:
      domain: k8s
      classes: [Event.v1.events.k8s.io]
    goal:
      domain: k8s
    result:
      query: |-
        {{- with .regarding -}}
        {{k8sClass .apiVersion .kind}}:{namespace: {{.namespace}}, name: {{.name}}}
        {{- end -}}

  - name: AllToEvent
    start:
      domain: k8s
    goal:
      domain: k8s
      classes: [Event.]
    result:
      query: >
        k8s:Event:{"namespace":"{{.metadata.namespace}}", "fields":{
        "involvedObject.namespace":"{{.metadata.namespace}}",
        "involvedObject.name": "{{.metadata.name}}",
        "involvedObject.kind": "{{.kind}}",
        "involvedObject.apiVersion": "{{.apiVersion}}"
        } }

  - name: DependentToOwner
    start:
      domain: k8s
    goal:
      domain: k8s
    result:
      query: |-
        {{- with index .metadata "ownerReferences"}}
          {{- with first . -}}
            {{$class := k8sClass .apiVersion .kind -}}
            {{$class}}:{
              {{- if k8sIsNamespaced $class}}"namespace":"{{$.metadata.namespace}}",{{- end -}}
            "name":"{{.name}}"}
          {{- end}}
        {{end -}}

  - name: PodToPVC
    start:
      domain: k8s
      classes: [Pod]
    goal:
      domain: k8s
      classes: [PersistentVolumeClaim]
    result:
      query: |-
        {{- range .spec.volumes}}
        {{- with index . "persistentVolumeClaim"}}
        k8s:PersistentVolumeClaim:{"namespace":"{{$.metadata.namespace}}","name":"{{.claimName}}"}
        {{- end}}
        {{- end}}

  - name: PodToConfigMap
    start:
      domain: k8s
      classes: [Pod]
    goal:
      domain: k8s
      classes: [ConfigMap]
    result:
      query: |-
        {{- range .spec.volumes}}
        {{- with index . "configMap"}}
        k8s:ConfigMap:{"namespace":"{{$.metadata.namespace}}","name":"{{.name}}"}
        {{- end}}
        {{- end}}

  - name: PodToSecret
    start:
      domain: k8s
      classes: [Pod]
    goal:
      domain: k8s
      classes: [Secret]
    result:
      query: |-
        {{- range .spec.volumes}}
        {{- with index . "secret"}}
        k8s:Secret:{"namespace":"{{$.metadata.namespace}}","name":"{{.secretName}}"}
        {{- end}}
        {{- end}}

  - name: PodToServiceAccount
    start:
      domain: k8s
      classes: [Pod]
    goal:
      domain: k8s
      classes: [ServiceAccount]
    result:
      query: |-
        k8s:ServiceAccount:{"namespace":"{{.metadata.namespace}}","name":"{{required (index .spec "serviceAccountName")}}"}

  - name: ServiceToEndpointSlice
    start:
      domain: k8s
      classes: [Service]
    goal:
      domain: k8s
      classes: [EndpointSlice.discovery.k8s.io]
    result:
      query: |-
        k8s:EndpointSlice.discovery.k8s.io:{"namespace":"{{.metadata.namespace}}","labels":{"kubernetes.io/service-name":"{{.metadata.name}}"}}

  - name: ServiceToEndpoints
    start:
      domain: k8s
      classes: [Service]
    goal:
      domain: k8s
      classes: [Endpoints]
    result:
      query: |-
        k8s:Endpoints:{"namespace":"{{.metadata.namespace}}","name":"{{.metadata.name}}"}

  - name: EndpointSliceToService
    start:
      domain: k8s
      classes: [EndpointSlice.discovery.k8s.io]
    goal:
      domain: k8s
      classes: [Service]
    result:
      query: |-
        k8s:Service:{"namespace":"{{.metadata.namespace}}","name":"{{required (index .metadata.labels "kubernetes.io/service-name")}}"}

  - name: PVCToPV
    start:
      domain: k8s
      classes: [PersistentVolumeClaim]
    goal:
      domain: k8s
      classes: [PersistentVolume]
    result:
      query: |-
        k8s:PersistentVolume:{"name":"{{required (index .spec "volumeName")}}"}

  - name: PVToPVC
    start:
      domain: k8s
      classes: [PersistentVolume]
    goal:
      domain: k8s
      classes: [PersistentVolumeClaim]
    result:
      query: |-
        {{- with .spec.claimRef}}
        k8s:PersistentVolumeClaim:{"namespace":"{{.namespace}}","name":"{{.name}}"}
        {{- end}}

  - name: PVToStorageClass
    start:
      domain: k8s
      classes: [PersistentVolume]
    goal:
      domain: k8s
      classes: [StorageClass.storage.k8s.io]
    result:
      query: |-
        k8s:StorageClass.storage.k8s.io:{"name":"{{required (index .spec "storageClassName")}}"}

  - name: PVCToStorageClass
    start:
      domain: k8s
      classes: [PersistentVolumeClaim]
    goal:
      domain: k8s
      classes: [StorageClass.storage.k8s.io]
    result:
      query: |-
        k8s:StorageClass.storage.k8s.io:{"name":"{{required (index .spec "storageClassName")}}"}

  - name: SubscriptionToCSV
    start:
      domain: k8s
      classes: [Subscription.v1alpha1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [ClusterServiceVersion.v1alpha1.operators.coreos.com]
    result:
      query: |-
        k8s:ClusterServiceVersion.v1alpha1.operators.coreos.com:{"name":"{{required (index .status "currentCSV")}}"}

  - name: CSVToCRD
    start:
      domain: k8s
      classes: [ClusterServiceVersion.v1alpha1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [CustomResourceDefinition.v1.apiextensions.k8s.io]
    result:
      query: |-
        {{- range .spec.customresourcedefinitions.owned }}
        k8s:CustomResourceDefinition.apiextensions.k8s.io:{"name":"{{ .name }}"}
        {{- end }}

  - name: CRToCRD
    start:
      domain: k8s
    goal:
      domain: k8s
      classes: [CustomResourceDefinition.apiextensions.k8s.io]
    result:
      query: |-
        {{- with k8sCRDName .apiVersion .kind -}}
        k8s:CustomResourceDefinition.apiextensions.k8s.io:{"name":"{{.}}"}
        {{- end -}}

  - name: CRDToInstances
    start:
      domain: k8s
      classes: [CustomResourceDefinition.apiextensions.k8s.io]
    goal:
      domain: k8s
    result:
      query: |-
        k8s:{{.spec.names.kind}}.{{(index .spec.versions 0).name}}.{{.spec.group}}:{}

  - name: CSVToDeployment
    start:
      domain: k8s
      classes: [ClusterServiceVersion.v1alpha1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [Deployment.apps]
    result:
      query: |-
        {{- range .spec.install.spec.deployments}}
        k8s:Deployment.apps:{"namespace":"{{$.metadata.namespace}}","name":"{{.name}}"}
        {{- end}}

  - name: SubscriptionToInstallPlan
    start:
      domain: k8s
      classes: [Subscription.v1alpha1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [InstallPlan.v1alpha1.operators.coreos.com]
    result:
      query: |-
        {{- with index .status "installPlanRef"}}
        k8s:InstallPlan.v1alpha1.operators.coreos.com:{"namespace":"{{.namespace}}","name":"{{.name}}"}
        {{- end}}

  - name: InstallPlanToCSV
    start:
      domain: k8s
      classes: [InstallPlan.v1alpha1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [ClusterServiceVersion.v1alpha1.operators.coreos.com]
    result:
      query: |-
        {{- range .spec.clusterServiceVersionNames}}
        k8s:ClusterServiceVersion.v1alpha1.operators.coreos.com:{"namespace":"{{$.metadata.namespace}}","name":"{{.}}"}
        {{- end}}

  - name: SubscriptionToCatalogSource
    start:
      domain: k8s
      classes: [Subscription.v1alpha1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [CatalogSource.v1alpha1.operators.coreos.com]
    result:
      query: |-
        k8s:CatalogSource.v1alpha1.operators.coreos.com:{"namespace":"{{required (index .spec "sourceNamespace")}}","name":"{{required (index .spec "source")}}"}

  - name: OperatorToCRD
    start:
      domain: k8s
      classes: [Operator.v1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [CustomResourceDefinition.apiextensions.k8s.io]
    result:
      query: |-
        {{- range .status.components.refs}}
        {{- if eq .kind "CustomResourceDefinition"}}
        k8s:CustomResourceDefinition.apiextensions.k8s.io:{"name":"{{.name}}"}
        {{- end}}
        {{- end}}

  - name: OperatorToCSV
    start:
      domain: k8s
      classes: [Operator.v1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [ClusterServiceVersion.v1alpha1.operators.coreos.com]
    result:
      query: |-
        {{- range .status.components.refs}}
        {{- if eq .kind "ClusterServiceVersion"}}
        k8s:ClusterServiceVersion.v1alpha1.operators.coreos.com:{"namespace":"{{.namespace}}","name":"{{.name}}"}
        {{- end}}
        {{- end}}

  - name: OperatorToSubscription
    start:
      domain: k8s
      classes: [Operator.v1.operators.coreos.com]
    goal:
      domain: k8s
      classes: [Subscription.v1alpha1.operators.coreos.com]
    result:
      query: |-
        {{- range .status.components.refs}}
        {{- if eq .kind "Subscription"}}
        k8s:Subscription.v1alpha1.operators.coreos.com:{"namespace":"{{.namespace}}","name":"{{.name}}"}
        {{- end}}
        {{- end}}

  - name: IngressToService
    start:
      domain: k8s
      classes: [Ingress.networking.k8s.io]
    goal:
      domain: k8s
      classes: [Service]
    result:
      query: |-
        {{- with index .spec "defaultBackend"}}
        {{- with .service}}
        k8s:Service:{"namespace":"{{$.metadata.namespace}}","name":"{{.name}}"}
        {{- end}}
        {{- end}}
        {{- range .spec.rules}}
        {{- range .http.paths}}
        {{- with .backend.service}}
        k8s:Service:{"namespace":"{{$.metadata.namespace}}","name":"{{.name}}"}
        {{- end}}
        {{- end}}
        {{- end}}

  - name: HPAToTarget
    start:
      domain: k8s
      classes: [HorizontalPodAutoscaler.autoscaling]
    goal:
      domain: k8s
    result:
      query: |-
        {{- with .spec.scaleTargetRef}}
        {{k8sClass .apiVersion .kind}}:{"namespace":"{{$.metadata.namespace}}","name":"{{.name}}"}
        {{- end}}

statusRules:
  - name: HasFinalizer
    start:
      domain: k8s
    status: |-
      {{- with index .metadata "finalizers"}}Finalizer{{end}}

  - name: EventType
    start:
      domain: k8s
      classes: [Event.v1, Event.v1.events.k8s.io]
    status: |-
      {{- with index . "type"}}{{if ne . "Normal"}}{{.}}{{end}}{{end}}

  - name: HealthStatus
    start:
      domain: k8s
    status: |-
      {{- k8sHealthStatus . -}}
